# Summit Air demo configuration.
#
# Every value here is invented for a fictional business and none of it describes a real HVAC
# company. It lives in config rather than in the prompt so the business can change without
# touching agent behavior: src/prompt.md is rendered from these values at the start of each call.

business:
  name: Summit Air
  timezone: America/New_York

coverage:
  # The three counties are Manhattan (New York County), Brooklyn (Kings) and Queens. Callers say the
  # borough, so the agent does too. The Bronx and Staten Island are out, which keeps a real New York
  # address on the out-of-area path.
  counties: [Manhattan, Brooklyn, Queens]
  # Known shortcut: ZIP prefixes approximate the boroughs. 110 is mostly Nassau County, so only
  # Queens' 11004 and 11005 are listed from it. A real deployment uses the customer's territory map.
  zip_prefixes: ["100", "101", "102", "112", "111", "113", "114", "116", "11004", "11005"]
  # What a caller may call the town when they don't know the ZIP: the boroughs, the city, and the
  # Queens post-office names people put on an envelope. An address in one of these books without
  # a ZIP; anywhere else needs the ZIP to be checked.
  towns:
    [Manhattan, New York, New York City, NYC, Brooklyn, Queens,
     # Queens post-office names, each inside the ZIP prefixes above (Floral Park and Bellerose
     # straddle the Nassau line, so they need the ZIP)
     Astoria, Long Island City, LIC, Sunnyside, Woodside, Jackson Heights, Elmhurst, East Elmhurst,
     Corona, Flushing, College Point, Whitestone, Bayside, Little Neck, Douglaston, Glen Oaks,
     Fresh Meadows, Oakland Gardens, Forest Hills, Rego Park, Kew Gardens, Kew Gardens Hills,
     Briarwood, Richmond Hill, Woodhaven, Ozone Park, Howard Beach, Jamaica, Hollis, Queens Village,
     Cambria Heights, Laurelton, Springfield Gardens, Rosedale, Saint Albans, St. Albans,
     Far Rockaway, Rockaway Park, Arverne, Ridgewood, Glendale, Maspeth, Middle Village,
     # neighborhoods a caller may give as the town
     Harlem, Washington Heights, Inwood, Upper West Side, Upper East Side, Midtown, Chelsea,
     Tribeca, SoHo, East Village, West Village, Lower East Side, Financial District,
     Williamsburg, Greenpoint, Bushwick, Bed-Stuy, Bedford-Stuyvesant, Park Slope, Crown Heights,
     Flatbush, Bay Ridge, Sunset Park, Red Hook, Carroll Gardens, Cobble Hill, Brooklyn Heights,
     Fort Greene, Clinton Hill, Prospect Heights, Sheepshead Bay, Bensonhurst, Canarsie,
     Coney Island, Brighton Beach, Dyker Heights, Borough Park, Windsor Terrace, Kensington,
     Midwood, East Flatbush, Bushwick, Ridgewood]

hours:
  office: { days: [mon, tue, wed, thu, fri], start: "08:00", end: "17:00" }
  arrival_windows:
    - { start: "08:00", end: "12:00" }
    - { start: "12:00", end: "16:00" }
  capacity_per_window: 3   # demo capacity, not derived from the 40-technician headcount
  days_ahead: 21

# What the agent books, and what it turns away in one sentence. Rendered into the prompt.
services:
  offered: [heating, cooling, heat pumps, boilers, ductless mini splits, maintenance]
  not_offered: [plumbing, water heaters, appliances]

pricing:
  diagnostic_fee: 89       # typical residential diagnostic fee; repairs are priced on site
  after_hours_fee: 159

callback_target_minutes:
  urgent: 15               # a target the demo states, not a staffed guarantee
  callback: 120

# Words the speech recognizer should expect: the service-area towns and HVAC vocabulary.
keyterms:
  - Summit Air
  - Manhattan
  - Brooklyn
  - Queens
  - Harlem
  - Washington Heights
  - Upper West Side
  - Upper East Side
  - Chelsea
  - Tribeca
  - Williamsburg
  - Greenpoint
  - Bushwick
  - Bed-Stuy
  - Park Slope
  - Crown Heights
  - Flatbush
  - Bay Ridge
  - Astoria
  - Long Island City
  - Flushing
  - Jackson Heights
  - Jamaica
  - Forest Hills
  - Ridgewood
  - Bayside
  - Bronx
  - Staten Island
  - AC
  - air conditioner
  - furnace
  - boiler
  - heat pump
  - mini split
  - ductless
  - condenser
  - thermostat
  - carbon monoxide
  - smell gas
  - gas smell
  - propane
