# Summit Air demo configuration.
#
# Every value here is invented for a fictional business and none of it describes a real HVAC
# company. It lives in config rather than in the prompt so the business can change without
# touching agent behavior: src/prompt.md is rendered from these values at the start of each call.

business:
  name: Summit Air
  timezone: America/New_York

coverage:
  counties: [Westchester, Rockland, Putnam]
  # ponytail: ZIP prefixes approximate the three counties (109 also covers part of Orange County,
  # and Patterson's 12563 is missed). A real deployment uses the customer's territory map.
  zip_prefixes: ["105", "106", "107", "108", "109"]

hours:
  office: { days: [mon, tue, wed, thu, fri], start: "08:00", end: "17:00" }
  arrival_windows:
    - { start: "08:00", end: "12:00" }
    - { start: "12:00", end: "16:00" }
  capacity_per_window: 3   # demo capacity, not derived from the 40-technician headcount
  days_ahead: 21

pricing:
  diagnostic_fee: 89       # typical residential diagnostic fee; repairs are priced on site
  after_hours_fee: 159

callback_target_minutes:
  urgent: 15               # a target the demo states, not a staffed guarantee
  callback: 120

# Words the speech recognizer should expect: the service-area towns and HVAC vocabulary.
keyterms:
  - Summit Air
  - White Plains
  - Yonkers
  - New Rochelle
  - Mount Vernon
  - Scarsdale
  - Mamaroneck
  - Larchmont
  - Tarrytown
  - Sleepy Hollow
  - Ossining
  - Peekskill
  - Yorktown Heights
  - Mount Kisco
  - Chappaqua
  - Pleasantville
  - Port Chester
  - Croton-on-Hudson
  - Katonah
  - Briarcliff Manor
  - Nyack
  - New City
  - Spring Valley
  - Suffern
  - Pearl River
  - Nanuet
  - Haverstraw
  - Stony Point
  - Monsey
  - Carmel
  - Mahopac
  - Brewster
  - Cold Spring
  - Putnam Valley
  - AC
  - air conditioner
  - furnace
  - boiler
  - heat pump
  - mini split
  - ductless
  - condenser
  - thermostat
  - carbon monoxide
