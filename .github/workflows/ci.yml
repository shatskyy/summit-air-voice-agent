# Deterministic checks only: lint, format and the rule tests. No secrets, no model, no credit.
# The model-backed tests (`pytest -m llm`) and the simulator (`python -m evals`) spend OpenAI
# credit through the spend ledger and stay manual.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Rule tests
        run: uv run pytest
