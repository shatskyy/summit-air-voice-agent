[project]
name = "summit-air-voice-agent"
version = "0.1.0"
description = "Inbound AI phone agent for Summit Air, a fictional HVAC company"
requires-python = ">=3.11, <3.15"

dependencies = [
    "livekit-agents~=1.8",
    "livekit-plugins-noise-cancellation~=0.3",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
package = false
constraint-dependencies = ["yarl<1.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
