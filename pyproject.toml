[project]
name = "summit-air-voice-agent"
version = "0.1.0"
description = "Inbound AI phone agent for Summit Air, a fictional HVAC company"
requires-python = ">=3.11, <3.15"

dependencies = [
    "aiohttp>=3.14.3",
    "livekit-agents~=1.8",
    "livekit-plugins-deepgram~=1.8",
    "livekit-plugins-noise-cancellation~=0.3",
    "livekit-plugins-openai~=1.8",
    "python-dotenv",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
package = false
constraint-dependencies = ["yarl<1.24"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
markers = ["llm: calls a real OpenAI model on OPENAI_API_KEY and spends from the ledger"]
addopts = "-m 'not llm'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["agent", "evals", "models", "receptionist", "store"]
